[platformio]
src_dir = pio_src

[env:n16r8]
; 55.03.39 is the last pioarduino platform on ESP-IDF 5.5.4, as is
; Arduino-ESP32 3.3.10. Override BOTH framework packages together.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.10/esp32-core-3.3.10.tar.xz
    framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.10/esp32-core-3.3.10-libs.tar.xz
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
; Must match factory's 0x180000 size in partitions.csv. PlatformIO otherwise
; keeps the board default (1 MiB) and rejects a valid 1.5 MiB application.
board_upload.maximum_size = 1572864
upload_speed = 921600
monitor_speed = 115200
build_unflags = -Os
build_flags =
    -O3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    adafruit/Adafruit SH110X@2.1.14
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
extra_scripts = pre:pio_upload_model.py
